name: Générer les stations Météo-France

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stations:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer stations-meteofrance.json
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
        run: python generate_stations.py

      - name: Vérifier le fichier
        run: |
          test -s data/stations-meteofrance.json
          python -m json.tool data/stations-meteofrance.json > /dev/null

      - name: Enregistrer le fichier dans GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/stations-meteofrance.json

          if git diff --cached --quiet; then
            echo "Aucune modification."
            exit 0
          fi

          git commit -m "Mise à jour des stations Météo-France"
          git push
